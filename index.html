<!doctype html>
<html lang="en">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYBERSPLASH | Luxury Fashion & Lifestyle Editorial</title>
    <meta name="description" content="Cybersplash is a modern fashion and lifestyle editorial platform for women embracing elegance, confidence, and individuality. Curated trends, styling ideas, and inspiring stories." />
    <meta property="og:title" content="CYBERSPLASH | Luxury Fashion & Lifestyle Editorial" />
    <meta property="og:description" content="Curated trends, effortless styling ideas, and inspiring stories defining modern fashion and timeless elegance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Critical above-the-fold CSS (inline for immediate rendering, eliminates render-blocking request chain) -->
    <style>
      :root {
        --bg-primary: #FFFDF8;
        --bg-secondary: #FFFAF1;
        --gold: #C9A44B;
        --gold-light: #E2CA89;
        --gold-dark: #A38133;
        --rose: #D47B9D;
        --rose-dark: #B85B80;
        --rose-light: #F8E6EE;
        --text-main: #4B3A3C;
        --text-muted: #77666A;
        --border-soft: #E7D8BD;
        --border-gold: #D8BF89;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-main);
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
      }

      h1, h2, h3, h4, .font-editorial {
        font-family: 'Cormorant Garamond', serif;
      }

      .font-display {
        font-family: 'Playfair Display', serif;
      }

      .font-script {
        font-family: 'Alex Brush', 'Pinyon Script', cursive;
      }

      .font-cinzel {
        font-family: 'Cinzel', serif;
      }

      .font-sans-clean {
        font-family: 'Montserrat', sans-serif;
      }
    </style>

    <!-- Google Fonts: preload for LCP, load after HTML parse -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pinyon+Script&display=swap" rel="preload" as="style" onload="this.rel='stylesheet'">
  </head>
  <body class="bg-[#FFFDF8] text-[#4B3A3C] antialiased selection:bg-[#D47B9D]/20 selection:text-[#4B3A3C]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
